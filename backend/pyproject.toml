[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krebsville-backend"
version = "0.1.0"
description = "FastAPI backend for Krebsville Nights: Unequal Treatment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlmodel==0.0.17",
  "python-dotenv==1.0.1",
  "pydantic-settings==2.3.4",
]

[tool.setuptools]
packages = ["app"]
